[project]
name = "getnet-multiagent-support"
version = "1.0.0"
description = "Multi-agent customer support system (Router, Knowledge/RAG, Customer Support, Human Escalation)"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["E501", "S101", "S311", "B008", "SIM108", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"evals/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: tests that call real external services / the Anthropic API (skipped by default)",
]
