services:
  api:
    build:
      context: .
      args:
        INSTALL_DEV: "true"   # include pytest/ruff so tests can run inside the container
    image: getnet-multiagent:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      INGEST_ON_STARTUP: ${INGEST_ON_STARTUP:-seed}
    volumes:
      - runtime-data:/app/data/runtime   # tickets survive restarts
    restart: unless-stopped

  # Optional observability stack: `docker compose --profile observability up`
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]

volumes:
  runtime-data:
