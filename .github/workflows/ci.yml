name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests evals
      - name: Unit + integration tests
        run: python -m pytest
      - name: Offline evaluation (regression gate)
        run: python -m evals.run_eval
      - name: LLM evaluation (only when the secret is configured)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: python -m evals.run_eval --llm --judge --no-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: evals/reports/*.md

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t getnet-multiagent:ci .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 -e LLM_PROVIDER=offline getnet-multiagent:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/chat -H 'Content-Type: application/json' \
            -d '{"message":"How many installments can I split a sale into with the crediário?","user_id":"cliente1988"}' | tee /dev/stderr | grep -q '48'
