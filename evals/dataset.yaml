# Evaluation dataset for the multi-agent system.
# Each case is scored on: routing (first agent of the plan), final agent, required tools,
# answer content (all `must_include` substrings, case-insensitive; `any_of` = at least one),
# forbidden content, escalation and guardrail behaviour.
# Categories let us slice the report (product, account, technical, general, safety, handoff).

- id: product-clasica-vs-smart
  category: product
  message: "What's the difference between the Get Clássica and the Get Smart?"
  expected_route: knowledge
  expected_tools: [search_knowledge_base]
  must_include: ["Get Smart", "Get Clássica"]
  any_of: ["4G", "Android", "apps"]
- id: general-weather-poa
  category: general
  message: "What's the weather forecast in Porto Alegre tomorrow?"
  expected_route: knowledge
  expected_tools: [get_weather]
  must_include: ["Porto Alegre"]
- id: account-yesterday-deposit
  category: account
  message: "When will the money from yesterday's sales be deposited?"
  expected_route: support
  expected_tools: [get_settlement_forecast]
  must_include: ["R$"]
  any_of: ["15/10/2026", "2026-10-15"]
- id: product-pix-bank-account
  category: product
  message: "Do I need a bank account to receive my sales via Pix?"
  expected_route: knowledge
  expected_tools: [search_knowledge_base]
  any_of: ["account", "conta"]
- id: technical-no-internet
  category: technical
  message: "My card machine won't connect to the internet, what should I do?"
  expected_route: support
  expected_tools: [get_terminal_status]
  any_of: ["Wi-Fi", "chip", "restart", "Restart"]
- id: product-antecipacao
  category: product
  message: "How does receivables advance (antecipação) work with Getnet?"
  expected_route: knowledge
  expected_tools: [search_knowledge_base]
  any_of: ["automatic", "Automatic", "on-demand", "On-demand", "Eventual"]
- id: general-euro
  category: general
  message: "What's the euro exchange rate today?"
  expected_route: knowledge
  expected_tools: [get_exchange_rate]
  must_include: ["EUR"]
- id: technical-decline
  category: technical
  message: "My card machine is showing a transaction decline error."
  expected_route: support
  expected_tools: [get_recent_declines]
  any_of: ["51", "05", "57"]
- id: product-crediario
  category: product
  message: "How many installments can I split a sale into with the crediário?"
  expected_route: knowledge
  expected_tools: [search_knowledge_base]
  must_include: ["48"]
- id: product-whatsapp-link
  category: product
  message: "Can I sell through WhatsApp using the Payment Link?"
  expected_route: knowledge
  expected_tools: [search_knowledge_base]
  must_include: ["WhatsApp"]
